# Financial baseline configuration.
#
# Benchmarks are full-service restaurant industry norms. Adjust for QSR (lower
# labor, higher food cost) or fine dining (higher both) if the demo client is
# not a typical full-service operation.

# ---------------------------------------------------------------------------
# P&L line-item mapping.
#
# Matched as case-insensitive substrings, first match wins, checked in the
# order listed. Real P&Ls spell the same line a dozen ways -- "Hourly Labor",
# "Wages - FOH", "Payroll - Hourly" -- so exact matching fails on every real
# file. Anything unmatched is reported as unclassified rather than dropped: a
# $30k line silently vanishing would distort every ratio downstream.
# ---------------------------------------------------------------------------
line_item_map:
  revenue:
    - sales
    - revenue
    - income
  cogs:
    - cogs
    - cost of goods
    - food cost
    - beverage cost
    - purchases
  labor:
    - labor
    - wages
    - payroll
    - salaried
    - management
    - benefits
  occupancy:
    - rent
    - cam
    - property tax
    - lease
  marketing:
    - marketing
    - advertising
    - promotion
  other_opex:
    - utilities
    - insurance
    - repairs
    - maintenance
    - supplies
    - smallwares
    - credit card
    - accounting
    - legal
    - delivery
    - commission
    - cleaning
    - sanitation
    - software
    - subscription
    - linen
    - uniform
    - pest
    - training
    - recruiting
    - bank
    - fees
    - other operating

# Labor lines that scale with covers. Salaried management does not move when
# one more table sits down, so it is excluded from contribution margin.
hourly_labor_keywords: [hourly, wages, foh, boh]

# Average check. The P&L has no cover count, so this comes from the POS. It
# only affects the break-even cover figure, not the budget itself.
avg_check: 38.00

# Floor for a loss-making or barely-profitable operation. Going dark carries
# its own risk; this is small enough to be maintenance rather than a bet.
minimum_spend_pct_of_revenue: 0.01

# ---------------------------------------------------------------------------
# Industry benchmarks. Ranges are share of total revenue.
#
# SOURCES (full-service restaurants, 2026):
#   food cost   28-35%, industry average 32.4%
#               National Restaurant Association, 2026 State of the Industry
#               https://vantainsights.com/insights/restaurant-food-cost-percentage
#   labor       target 30-35%. NOTE: 2025 median is 36.5% and profitable
#               operators hold 34.2% (BLS food-services data / NRA 2026). The
#               range below is therefore a target, not a median -- most
#               full-service restaurants now run above it.
#               https://gratuitysolutions.com/blog/what-percentage-should-labor-cost-be-restaurant
#   prime cost  60-65% for most full-service concepts
#               https://www.useforcs.com/blog/restaurant-prime-cost-explained/
#               https://restaurantinventorytools.com/what-is-prime-cost-in-a-restaurant-2026/
#   occupancy   6-10%, standard industry guidance
#   net margin  3-9%, standard industry guidance
# ---------------------------------------------------------------------------
benchmarks:
  food_cost_pct:   { low: 0.28, high: 0.35 }
  labor_cost_pct:  { low: 0.30, high: 0.35 }
  # Corrected from 0.55: sources put the full-service target at 60-65%, not 55%.
  prime_cost_pct:  { low: 0.60, high: 0.65 }
  occupancy_pct:   { low: 0.06, high: 0.10 }
  net_margin_pct:  { low: 0.03, high: 0.09 }

# ---------------------------------------------------------------------------
# Allocation bands, keyed on prime cost (food + labor as a share of revenue) --
# the single number that decides restaurant health.
#
# SOURCE for the marketing percentages: 3-6% of revenue is the consistently
# cited benchmark for established restaurants; independents under $5M often sit
# lower at 2-5%; new restaurants run 6-10% during launch.
#   https://get.chownow.com/blog/restaurant-marketing-budget/
#   https://backofhouse.io/resources/whats-an-average-restaurant-marketing-budget
#   https://theforkinggroup.com/insights/growth-revenue/restaurant-marketing-budget/
#
# The healthy (6%) and stable (4%) rates sit inside that published range. The
# tight (3%) rate is at its floor. The distressed (2%) rate is DELIBERATELY
# BELOW the published range -- an editorial judgment, not a sourced figure: a
# restaurant above 70% prime cost has a cost problem, not a demand problem.
#
# The 60-80% digital share of marketing spend reported in the same sources
# supports the splits below (paid_social + influencer lands at 62-67%).
#
# The distressed band is the one that matters. A restaurant above 70% prime
# cost does not have a marketing problem, and spending its remaining margin on
# ads accelerates the failure. Budget drops to maintenance level and the
# rationale says why, rather than quietly returning a small number.
# ---------------------------------------------------------------------------
bands:
  healthy:
    # Real capacity to invest; still keeps 60% of profit.
    profit_payout_ratio: 0.4
    max_prime_cost: 0.60
    marketing_pct_of_revenue: 0.06
    split: { menu_experimentation: 0.25, paid_social: 0.45, influencer: 0.22, reserve: 0.08 }
  stable:
    # Profit is the usual binding constraint at this band.
    profit_payout_ratio: 0.5
    max_prime_cost: 0.65
    marketing_pct_of_revenue: 0.04
    split: { menu_experimentation: 0.28, paid_social: 0.42, influencer: 0.20, reserve: 0.10 }
  tight:
    # Protect profit -- it is thin and doing other work.
    profit_payout_ratio: 0.35
    max_prime_cost: 0.70
    marketing_pct_of_revenue: 0.03
    split: { menu_experimentation: 0.30, paid_social: 0.38, influencer: 0.17, reserve: 0.15 }
  distressed:
    # Whatever profit exists is needed elsewhere.
    profit_payout_ratio: 0.2
    max_prime_cost: 999
    marketing_pct_of_revenue: 0.02
    # Experimentation is cheap and reversible; paid social is expensive and slow
    # to pay back. A distressed kitchen should be testing, not buying reach.
    split: { menu_experimentation: 0.30, paid_social: 0.40, influencer: 0.20, reserve: 0.10 }

constraints:
  # A new dish must clear this contribution margin to be worth the disruption.
  # Tightens as the business gets less healthy.
  min_dish_margin_pct:
    healthy: 0.65
    stable: 0.68
    tight: 0.70
    distressed: 0.75
  # Capex for new equipment comes out of reserve, and only above this band.
  # Below it, Part 2 must reject any dish that needs a new piece of kit.
  capex_allowed_bands: [healthy, stable]
