# Pipeline configuration.
#
# Everything tunable lives here so nothing needs editing in Python at 2am
# during the demo.

# Three tiers. Wider (national / abroad) answers "what is going viral
# anywhere." Regional and local answer "is this already showing up here?"
# Nearby is one factor, not a filter -- a 400-view Houston review is scored
# on the local tier, not against Nick DiGiovanni, but a Seoul or LA plate
# still belongs on the board. Override at run time with --city.
#
# Defaults match Ember & Rye (Houston). Night Owl Noodles is Chicago:
#   python -m ingestion.pipeline --city Chicago
location:
  city: Houston
  neighborhood: The Heights
  county: Harris County
  region_name: Texas
  state: TX
  region_code: US
  latitude: 29.7990              # The Heights, not downtown
  longitude: -95.3984
  timezone: America/Chicago
  trends_geo: US-TX-618          # Houston DMA
  trends_geo_region: US-TX

youtube:
  # search.list costs 100 quota units per query against a 10,000/day budget, so
  # this list is the main thing controlling burn rate. Everything else is ~1 unit.
  #
  # Queries are category-scoped on purpose, verified against live results:
  #   - "viral <category> recipe" returns actual dishes, and the same dish
  #     appearing across several creators is the trend signal we want.
  #   - Abstract queries ("food trends 2026", "new restaurant dish") return
  #     industry commentary, expo announcements, and travel guides. No dishes.
  # NOTE: these deliberately avoid the words "viral" and "trending". Those
  # words match TITLES CLAIMING virality, not videos that achieved it -- a pull
  # using "trending dessert recipe" returned 11 channels whose titles all said
  # "Viral"/"Trending" and which had ~11,400 views between them. Let the view
  # counts decide what is hot; the query only decides the topic.
  # ---------------------------------------------------------------------------
  # CHANNEL DISCOVERY -- the cheap path, and the main one.
  #
  # search.list costs 100 quota units per call; playlistItems.list costs 1, and
  # every channel has an "uploads" playlist. Pulling recent uploads from these
  # channels costs ~60 units for ~1,500 videos, where 24 keyword searches cost
  # 2,400 units for ~300.
  #
  # It is also better content: a search-only pull was roughly a third non-US
  # home cooking that had to be filtered back out. A curated US roster answers
  # the origin question before the first request.
  #
  # Add channels by @handle. Handle -> playlist mapping is cached on disk.
  # ---------------------------------------------------------------------------
  # Empty on purpose. A fixed roster is someone else's taste — if you do not
  # watch these people, their uploads should not be the board. Search is
  # built from the kitchen (city / cuisine / rising terms) at run time.
  # Paste handles here only if you want that extra cheap pull.
  channels: []
  channel_videos_each: 50
  # Channels publish weekly, not daily, so a 14-day window caps out around 6
  # videos each. Channel pulls use their own wider window -- a dish several
  # creators made over a month is still a trend, and unlike keyword search the
  # quota cost of looking further back is zero.
  channel_window_days: 45

  # Keyword search is now a SUPPLEMENT, not the main path. Channel discovery
  # above costs ~2 units per channel; each search below costs 100. These exist
  # only to catch dishes trending outside the curated roster, so the list is
  # deliberately short.
  # Query strings are built in ingestion/queries.py from the kitchen.
  # Do not list dishes here.
  # Used on local-scope search.list only. Geotagged uploads are scarce;
  # city-in-query remains the main local YouTube path.
  location_radius: 25km

  # What's actually popular on YouTube in this country right now. 1 quota unit
  # for 50 videos, then a food-title filter. This is the cheapest way to catch
  # a dish the curated roster has not covered yet.
  include_most_popular: true
  most_popular_category: "26"    # Howto & Style -- cooking lives here
  # Empty = the kitchen's own region_code only.
  most_popular_regions: []

  results_per_query: 50
  # Comments carry the sentiment signal; titles and descriptions are marketing.
  comments_per_video: 20
  # "medium" excludes Shorts from the main pass, which is where hashtag spam
  # concentrates. Shorts come back through the quality-gated pass below.
  duration: medium
  # Both orderings run for every query. relevance ranks on keyword match and is
  # biased against big creators (natural titles match less literally);
  # viewCount ranks on actual audience but admits bait, which the language and
  # engagement gates remove. Running only relevance produced a pull with a
  # median of 124 views and nothing above 1M.
  # viewCount only. Relevance ordering was there to avoid Shorts spam, but the
  # engagement and country gates handle that now, and reach-weighted scoring
  # means popularity is what we are actually after. Halves the search quota.
  orders: [viewCount]

  # regionCode and relevanceLanguage only RANK results -- they do not filter by
  # origin. A live pull returned a large amount of South Asian home cooking
  # with English titles, which is real content but not servable in a US
  # restaurant. defaultAudioLanguage is the only mechanical origin signal
  # YouTube gives. It is often unset, and an unset value passes through to the
  # extraction relevance gate rather than being dropped, since dropping on
  # missing metadata would discard a lot of legitimate US content.
  # Channel country is the strongest mechanical origin signal YouTube gives.
  # Declared audio language is NOT reliable on its own -- an Indian
  # village-cooking channel with 12.9M views declares "en-US". Channel country
  # is set by the owner on the channel and is accurate where present.
  # It is unset on ~60% of channels; those pass through to the extraction
  # relevance gate rather than being dropped, since dropping on missing
  # metadata would take most of the legitimate US content with it.
  # Empty on purpose. A US-only gate is why Seoul cafe desserts and
  # Tokyo convenience-store plates never reached Discover.
  allowed_channel_countries: []

  # Kept as a secondary filter only: it does catch honestly-declared non-English
  # audio (one pull dropped 299 videos on hi/ur/ta), but cannot be trusted
  # alone for the reason above.
  allowed_audio_languages: []

  # ---------------------------------------------------------------------------
  # SHORTS PASS
  # Shorts are where food trends actually break, but also where engagement bait
  # lives -- a first pass at order=viewCount returned Hindi-language vlogs with
  # #viral #recipe tagged on and no dish in them.
  #
  # The filter is the ENGAGEMENT RATE, not the view count. Bait accumulates
  # views without earning likes or comments; genuine food content converts at a
  # much higher rate. Filtering on raw views selects for exactly the wrong
  # thing, which is why the main pass excludes Shorts entirely.
  # ---------------------------------------------------------------------------
  include_shorts: true
  # Shorts carry most of the reach: 7 of the top 10 videos by views in a live
  # pull were Shorts, including the 241k-view chicken au poivre that the
  # long-form-only ranking buried.
  shorts_results_per_query: 15
  # Typical genuine like rate is 4-8% of views; bait sits well below.
  shorts_min_like_rate: 0.015
  shorts_min_comments: 8

  # A video nobody watched is not evidence of a trend. Applies to every video,
  # not just Shorts -- 75% of a relevance-only pull was under 1,000 views.
  min_views: 1000

  # ---------------------------------------------------------------------------
  # WHAT COUNTS AS VIRAL
  #
  # Raw views conflate "this dish went viral" with "a 46M-subscriber channel
  # posted something". The separator is the BREAKOUT RATIO: a video's views
  # against its own channel's median. A 2M-view video on a channel that
  # averages 200k means the dish drove it, not the subscriber base -- that is
  # the Dubai-chocolate signature.
  #
  # A video is viral if it clears min_views AND either breaks out against its
  # channel or is accumulating views fast enough to be mid-surge.
  # ---------------------------------------------------------------------------
  virality:
    # Set true to keep ONLY videos that clear the virality bar. Off by default
    # so the bar can be tuned against real output before it starts discarding.
    viral_only: false
    min_views: 15000
    breakout_ratio: 2.0       # >= 2x the channel's own median
    min_views_per_day: 15000  # long-form still climbing
    min_views_per_day_shorts: 8000
    # Markers are a scoring bonus, not a gate. Requiring them dropped real
    # breakout recipes whose titles never said "viral".
    require_trend_marker: false
    trend_markers:
      - viral
      - trending
      - tiktok
      - "i tried"
      - hype
      - everyone
      - internet
      - famous
      - obsessed
    # Celebrity interviews and brand features rack up views that are about the
    # guest, not the dish. They stay in the corpus (extraction may still find
    # a real dish) but scoring treats their reach as weak evidence.
    evergreen_markers:
      - " joins "
      - "talks about"
      - interview
      - "loves "
      - "everything food"
      - "we tried every"
      - "5 golden rules"
      - "from the test kitchen"

google_trends:
  # Two jobs, not one. Discovery pulls rising food searches (national daily
  # trends plus related queries at the restaurant's DMA) and seeds YouTube.
  # Velocity then scores the dishes extraction already found, nationally and
  # at the DMA, so a dish that is fading nationwide but climbing here is
  # visible. pytrends is unofficial and Google throttles it; either job
  # degrades to empty rather than failing the run.
  timeframe: now 7-d
  discover: true
  discover_limit: 12
  # Percent change (second half of window vs first) that flips momentum.
  rising_threshold_pct: 15
  fading_threshold_pct: -15
  # Google rate-limits pytrends hard; a failed batch degrades to no velocity
  # for those dishes rather than failing the run.
  max_retries: 3
  retry_delay_seconds: 3
  # pytrends is unofficial and Google throttles it hard. Once 429s start they
  # usually continue for the session, so stop trying rather than burning
  # minutes on retries that will not succeed.
  give_up_after_429s: 3
  # Rising local queries are campaign material for Part 3, not a ranking input.
  # One extra request per dish -- turn off if rate limits bite.
  fetch_rising: true

extraction:
  # Clustering is high-volume classification; synthesis is short summarization
  # over evidence that has already been selected. Neither needs a frontier
  # model, and clustering is where nearly all the tokens go -- Haiku is roughly
  # 5x cheaper per token than Opus and skips thinking tokens entirely.
  #
  # NOTE: Haiku 4.5 rejects adaptive thinking and the effort parameter with a
  # 400. extract.py builds request params per-model, so setting either of these
  # to an Opus/Sonnet id re-enables them automatically.
  cluster_model: claude-haiku-4-5
  reason_model: claude-haiku-4-5
  # Cap posts reaching the model. Set above the expected corpus size (33
  # channels yield ~620 videos) because sampling down defeats the reason the
  # roster was expanded: clustering needs the same dish to appear across
  # several creators, and discarding half the corpus discards half the chances
  # of that. Haiku makes the extra calls cheap -- ~28 batches at batch_size 25.
  # Sampled per scope, not globally: local posts pull 20-900 views against
  # national's hundreds of thousands, so a global top-N cut would delete the
  # local tier outright. source_floors do the same for Maps reviews, which
  # have no view count that can compete with YouTube.
  max_posts: 700
  scope_floors:
    local: 80
    regional: 60
  source_floors:
    google_maps: 80
  # Posts per clustering call. Larger batches see more context at once (better
  # clustering) but each call gets slower and the running dish list grows.
  batch_size: 25
  effort: medium
  # why_trending synthesis is one call per dish; a dish with a single mention
  # will not survive ranking anyway.
  explain_top_n: 20
  # Synthesis calls are independent. Run sequentially this was the slowest
  # stage in the pipeline -- ~20 calls at 8s each.
  synthesis_workers: 8

output:
  # Small enough to eyeball for quality before presenting, which is the only
  # QA process a 2-day build affords.
  max_dishes: 20
  # A dish mentioned once is not a trend, it is one video. Without this floor
  # singletons dominate the ranking purely by arriving: in a 180-post run,
  # 14 of the top 20 had a single mention and pushed a genuine 3-creator
  # cluster down to rank 12. Trends are defined by independent repetition.
  min_mentions: 1

scoring:
  # virality is what separates a trend from a recipe. Two food-media channels
  # both posting a mushroom risotto video clusters exactly like a real trend
  # does -- same mention count, same reach band -- but neither video broke out
  # against its channel or was framed as trend coverage. Scoring on it rather
  # than filtering on it keeps the list long enough to be useful while pushing
  # the coincidences down: a hard viral_only gate left only 84 of 596 posts,
  # which is too few to cluster.
  #
  # reach measures DEMAND -- how many people actually
  # watched. volume measures SUPPLY -- how many creators posted -- and is
  # weighted low because content farms manufacture supply: a live pull found 11
  # channels all posting the same "Dubai Viral Qishta" video for ~11,400 total
  # views, while one chicken au poivre Short pulled 241,000 on its own. Ranking
  # on volume put the qishta cluster first, which was backwards.
  weights:
    reach: 0.18
    virality: 0.26
    velocity: 0.16
    volume: 0.10
    breadth: 0.08
    recency: 0.07
    local: 0.08
    local_spike: 0.07
  recency_halflife_days: 5
  # Momentum thresholds on mean breakout ratio, used when Google Trends is
  # unreachable (it rate-limits per IP at ~8-10 sessions/hour). A dish whose
  # videos consistently outperform their channels' own medians is one the
  # audience is seeking out.
  rising_breakout: 1.8
  fading_breakout: 0.7
  # Maps-only dishes have no breakout ratio. This many distinct local
  # restaurants in the review window is enough to call it rising.
  rising_local_restaurants: 4

# ---------------------------------------------------------------------------
# GOOGLE MAPS — county-level diner signal.
#
# YouTube is national food media. Maps is what people in this county ordered
# last week. Playwright opens Maps with the restaurant's GPS injected so
# "food near me" is Harris County, not the scrape machine's IP.
#
# The trend unit is restaurants, not reviews: the same dish in newest reviews
# at several independent places inside review_window_days.
# ---------------------------------------------------------------------------
google_maps:
  enabled: true
  headless: true
  review_window_days: 14
  max_places: 12
  reviews_per_place: 8
  max_queries: 4
  scroll_steps: 4
  timeout_ms: 45000
  min_restaurants_for_spike: 2
  queries:
    - "restaurants in {county}, {state}"
    - "best new restaurants in {city}"
    - "food near me"
    - "viral food {city}"
    - "must try {city}"
  food_type_queries:
    - "{food_type} in {county}"
  food_types: []
